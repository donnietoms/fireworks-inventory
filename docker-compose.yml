version: '3.8'

services:
  # Backend API
  api:
    build: .
    container_name: fireworks-api
    working_dir: /app/server
    command: node index.js
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    volumes:
      - ./server:/app/server
    networks:
      - fireworks-network

  # Frontend
  frontend:
    build: .
    container_name: fireworks-frontend
    working_dir: /app
    command: npx serve -s dist -l 5173
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - fireworks-network

networks:
  fireworks-network:
    driver: bridge
